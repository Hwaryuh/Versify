<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Versify</title>
  <link rel="stylesheet" href="base.css">
  <style>
    /* 툴바 팝업: 리모컨 역할만. 키·엔진·캐시는 옵션 페이지에서 */
    body { width: 340px; padding: 16px 20px 20px; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    header img { width: 28px; height: 28px; }
    h1 { flex-grow: 1; margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
    .icon-btn { display: grid; place-items: center; width: 44px; min-height: 44px; margin-right: -10px; padding: 0; background: transparent; color: var(--sub); border-radius: 50%; }
    .icon-btn:hover { color: var(--text); background: var(--field); }
    .icon-btn svg { width: 20px; height: 20px; }
    .engine { display: flex; align-items: center; gap: 8px; margin: 0; padding: 12px 14px; background: var(--field); border-radius: 10px; color: var(--sub); font-size: 13px; }
    .engine strong { color: var(--text); font-weight: 700; }
    .dot { flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .no-key { padding: 14px; background: var(--field); border: 1px solid var(--line); border-radius: 10px; }
    .no-key p { margin: 0 0 12px; font-weight: 700; }
    .no-key button { width: 100%; }
    .check { margin-top: 8px; }
    #show-panel { width: 100%; margin-top: 12px; }
    #status { min-height: 20px; margin: 8px 0 0; text-align: center; font-size: 13px; color: var(--danger); }
  </style>
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="">
    <h1>Versify</h1>
    <button class="icon-btn" id="open-settings" type="button" data-i18n-label="settings">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 3.3h6.6a2 2 0 0 1 3.8 0H14v1.4h-1.6a2 2 0 0 1-3.8 0H2zm8.5-.2a.8.8 0 1 0 0 1.8.8.8 0 0 0 0-1.8zM2 11.3h1.6a2 2 0 0 1 3.8 0H14v1.4H7.4a2 2 0 0 1-3.8 0H2zm3.5-.2a.8.8 0 1 0 0 1.8.8.8 0 0 0 0-1.8z"/></svg>
    </button>
  </header>

  <p class="engine" id="engine-ready" hidden><span class="dot" aria-hidden="true"></span><span id="engine-text"></span></p>
  <div class="no-key" id="engine-missing" hidden>
    <p data-i18n="noKeyTitle"></p>
    <button class="secondary" id="add-key" type="button" data-i18n="openSettings"></button>
  </div>

  <label class="check"><input type="checkbox" id="autoTranslate"> <span data-i18n="autoTranslateLabel"></span></label>

  <button class="primary" id="show-panel" type="button" data-i18n="openPanel"></button>
  <p id="status" role="status"></p>

  <script src="popup.js"></script>
</body>
</html>
