<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title data-i18n="popupTitle"></title>
  <link rel="stylesheet" href="base.css">
  <style>
    /* chrome://extensions 옵션 대화상자 안에 들어가므로 너비는 대화상자를 따른다 */
    body { padding: 8px 24px 24px; }
    main { max-width: 560px; margin: 0 auto; }
    section { padding: 24px 0; border-top: 1px solid var(--divider); }
    section:first-child { border-top: 0; padding-top: 16px; }
    .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    h2 { margin: 0; font-size: 15px; font-weight: 700; }
    .saved { color: var(--accent); font-size: 13px; opacity: 0; transition: opacity .2s ease-out; }
    .saved.show { opacity: 1; transition: none; }
    .field + .field { margin-top: 20px; }
    .cache { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    #cache-info { margin: 0; color: var(--sub); }
    #cache-clear { flex-shrink: 0; min-width: 136px; }
    footer { padding-top: 16px; border-top: 1px solid var(--divider); color: var(--sub); font-size: 13px; }
    @media (prefers-reduced-motion: reduce) { .saved { transition: none; } }
  </style>
</head>
<body>
<main>
  <section>
    <div class="sec-head"><h2 id="engine-title" data-i18n="engineLegend"></h2><span class="saved" role="status"></span></div>
    <div class="field">
      <div class="seg" role="radiogroup" aria-labelledby="engine-title">
        <input type="radio" name="engine" id="engine-deepl" value="deepl"><label for="engine-deepl">DeepL</label>
        <input type="radio" name="engine" id="engine-claude" value="claude"><label for="engine-claude">Claude</label>
      </div>
      <p class="hint" id="engine-hint"></p>
    </div>

    <div class="field" id="deepl-fields">
      <label for="deeplKey" data-i18n="deeplKeyLabel"></label>
      <input type="password" id="deeplKey" autocomplete="off" spellcheck="false" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx:fx" aria-describedby="deeplKey-error">
      <p class="field-error" id="deeplKey-error" hidden></p>
      <p class="hint"><a href="https://www.deepl.com/pro-api" target="_blank" rel="noopener" data-i18n="getFreeKey"></a> · <span data-i18n="deeplKeyTypes"></span></p>
    </div>

    <div id="claude-fields" hidden>
      <div class="field">
        <label for="claudeKey" data-i18n="claudeKeyLabel"></label>
        <input type="password" id="claudeKey" autocomplete="off" spellcheck="false" placeholder="sk-ant-..." aria-describedby="claudeKey-error">
        <p class="field-error" id="claudeKey-error" hidden></p>
        <p class="hint"><a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener" data-i18n="getKey"></a> · <span data-i18n="keyStoredLocally"></span></p>
      </div>
      <div class="field">
        <label for="claudeModel" data-i18n="modelLabel"></label>
        <select id="claudeModel">
          <option value="claude-opus-5-5" data-i18n="modelOpus"></option>
          <option value="claude-sonnet-5-5" data-i18n="modelSonnet"></option>
          <option value="claude-haiku-5-5" data-i18n="modelHaiku"></option>
        </select>
      </div>
    </div>
  </section>

  <section>
    <div class="sec-head"><h2 data-i18n="sectionOutput"></h2><span class="saved" role="status"></span></div>
    <div class="field">
      <label for="targetLang" data-i18n="targetLangLabel"></label>
      <select id="targetLang">
        <option value="KO" data-i18n="langKo"></option>
        <option value="JA" data-i18n="langJa"></option>
        <option value="ZH" data-i18n="langZh"></option>
        <option value="EN-US" data-i18n="langEn"></option>
      </select>
    </div>
    <div class="field">
      <span class="label" id="register-title" data-i18n="registerLegend"></span>
      <div class="seg" role="radiogroup" aria-labelledby="register-title">
        <input type="radio" name="register" id="reg-casual" value="casual"><label for="reg-casual" data-i18n="registerCasual"></label>
        <input type="radio" name="register" id="reg-polite" value="polite"><label for="reg-polite" data-i18n="registerPolite"></label>
      </div>
    </div>
  </section>

  <section>
    <div class="sec-head"><h2 data-i18n="sectionBehavior"></h2><span class="saved" role="status"></span></div>
    <label class="check"><input type="checkbox" id="autoTranslate"> <span data-i18n="autoTranslateLabel"></span></label>
    <label class="check"><input type="checkbox" id="preferSpotify"> <span data-i18n="preferSpotifyLabel"></span></label>
  </section>

  <section>
    <div class="sec-head"><h2 data-i18n="sectionCache"></h2><span class="saved" role="status"></span></div>
    <div class="cache">
      <p id="cache-info" data-i18n="cacheChecking"></p>
      <button id="cache-clear" class="secondary" type="button" disabled data-i18n="cacheClear"></button>
    </div>
  </section>

  <footer data-i18n="lyricsSources"></footer>
</main>
<script src="options.js"></script>
</body>
</html>
